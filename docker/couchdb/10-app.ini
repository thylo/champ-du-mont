; Configuration CouchDB chargée en plus de celle de l'image officielle.

[couchdb]
; Nœud unique : crée automatiquement _users, _replicator et _global_changes
single_node = true
max_document_size = 8000000

[chttpd]
; Les requêtes anonymes restent possibles (nécessaire pour POST /_session),
; l'accès aux données est contrôlé par le _security de chaque base.
require_valid_user = false

[chttpd_auth]
; Durée de validité du cookie de session (secondes), renouvelé à chaque requête
timeout = 604800
allow_persistent_cookies = true
same_site = lax

[couch_httpd_auth]
; Empêche la lecture de la liste des utilisateurs par d'autres utilisateurs
users_db_public = false
