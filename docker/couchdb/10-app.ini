; Configuration CouchDB chargée en plus de celle de l'image officielle.

[couchdb]
; Nœud unique : crée automatiquement _users, _replicator et _global_changes
single_node = true

[chttpd]
; Requêtes anonymes possibles, l'accès aux données est contrôlé par le _security de chaque base
require_valid_user = false

[couch_httpd_auth]
; Empêche la lecture de la liste des utilisateurs par d'autres utilisateurs
users_db_public = false
