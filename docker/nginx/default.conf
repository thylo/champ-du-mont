server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fichiers buildés par Vite (noms hashés) : cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    # Page, service worker et manifest : toujours revalidés, sinon l'app reste sur une vieille version
    location ~ ^/(index\.html|sw\.js|manifest\.webmanifest)?$ {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # Proxy CouchDB : même origine que l'app → pas de CORS, cookie de session OK.
    # Réécriture basée sur $request_uri pour préserver l'encodage (ex. _design%2Ffoo).
    location /db/ {
        # DNS interne Docker (requis car proxy_pass utilise une variable ;
        # permet aussi de suivre l'IP de CouchDB s'il redémarre)
        resolver 127.0.0.11 valid=10s ipv6=off;

        rewrite ^ $request_uri;
        rewrite ^/db/(.*) /$1 break;
        proxy_pass http://couchdb:5984$uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Réplication live (_changes en longpoll) + pièces jointes
        proxy_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 50m;
    }

    # Fauxton n'est pas exposé publiquement (accessible en local sur :5984/_utils)
    location /db/_utils {
        return 404;
    }
}
