# Local :  npm run db:up   → CouchDB seul (l'app tourne avec `npm run dev`)
# Prod :   docker compose up -d --build   (même fichier sur Coolify : domaine sur le service web, port 80)
# Aucun port publié ici : Coolify joint `web` par son proxy. Les ports locaux sont dans compose.override.yaml.

name: champ-du-mont

services:
  couchdb:
    build:
      context: docker/couchdb
      target: couchdb
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:?COUCHDB_USER manquant dans .env}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?COUCHDB_PASSWORD manquant dans .env}
    volumes:
      - couchdb-data:/opt/couchdb/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5984/_up || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Bases, droits, règles et utilisateurs. Idempotent, s'arrête une fois fini.
  couchdb-init:
    build:
      context: docker/couchdb
      target: init
    depends_on:
      couchdb:
        condition: service_healthy
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
      BENEVOLE_PASSWORD: ${BENEVOLE_PASSWORD:?BENEVOLE_PASSWORD manquant dans .env}
      GESTION_PASSWORD: ${GESTION_PASSWORD:?GESTION_PASSWORD manquant dans .env}
    restart: "no"

  web:
    build:
      context: .
      args:
        VITE_BENEFICIAIRE: ${VITE_BENEFICIAIRE:?VITE_BENEFICIAIRE manquant dans .env}
        VITE_IBAN: ${VITE_IBAN:?VITE_IBAN manquant dans .env}
        # Optionnel : « libre » si une app bancaire ne reprend pas la communication structurée
        VITE_CHAMP_REF: ${VITE_CHAMP_REF:-structure}
    restart: unless-stopped
    depends_on:
      couchdb:
        condition: service_healthy

volumes:
  couchdb-data:
